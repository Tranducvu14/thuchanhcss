
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form đăng ký sinh viên</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .form-container {
            position: relative;
            width: 90%;
            max-width: 750px;
            margin: 60px auto;
            padding: 35px 25px 25px;
            background-color: white;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
        }

        .form-label {
            position: absolute;
            top: -15px;
            right: 20px;
            padding: 8px 15px;
            background-color: #0f766e;
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex: 1;
            min-width: 0;
            flex-direction: column;
            gap: 7px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #0f766e;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 12px 0;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }

        .form-buttons button {
            padding: 11px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-submit {
            background-color: #0f766e;
            color: white;
        }

        .btn-submit:hover {
            background-color: #115e59;
        }

        .btn-reset {
            background-color: #e2e8f0;
            color: #1e293b;
        }

        .btn-reset:hover {
            background-color: #cbd5e1;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
            }

            .form-buttons {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <h1>ĐĂNG KÝ SINH VIÊN</h1>

    <div class="form-container">
        <span class="form-label">ĐĂNG KÝ MỚI</span>

        <form action="#" method="get">
            <div class="form-row">
                <div class="form-group">
                    <label for="fullname">Họ và tên:</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Nhập họ và tên"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Nhập email"
                        required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="student-id">Mã sinh viên:</label>
                    <input
                        type="text"
                        id="student-id"
                        name="student-id"
                        placeholder="Nhập mã sinh viên"
                        required>
                </div>

                <div class="form-group">
                    <label for="birthday">Ngày sinh:</label>
                    <input
                        type="date"
                        id="birthday"
                        name="birthday">
                </div>
            </div>

            <label>Giới tính:</label>
            <div class="options">
                <label>
                    <input type="radio" name="gender" value="Nam">
                    Nam
                </label>
                <label>
                    <input type="radio" name="gender" value="Nữ">
                    Nữ
                </label>
                <label>
                    <input type="radio" name="gender" value="Khác">
                    Khác
                </label>
            </div>

            <label>Sở thích:</label>
            <div class="options">
                <label>
                    <input type="checkbox" name="hobby" value="Đọc sách">
                    Đọc sách
                </label>
                <label>
                    <input type="checkbox" name="hobby" value="Nghe nhạc">
                    Nghe nhạc
                </label>
                <label>
                    <input type="checkbox" name="hobby" value="Thể thao">
                    Thể thao
                </label>
            </div>

            <div class="form-group">
                <label for="major">Ngành học:</label>
                <select id="major" name="major">
                    <option value="">-- Chọn ngành học --</option>
                    <option value="CNTT">Công nghệ thông tin</option>
                    <option value="QTKD">Quản trị kinh doanh</option>
                    <option value="TKDH">Thiết kế đồ họa</option>
                </select>
            </div>

            <div class="form-group" style="margin-top: 16px;">
                <label for="note">Ghi chú:</label>
                <textarea
                    id="note"
                    name="note"
                    rows="3"
                    placeholder="Nhập ghi chú nếu có"></textarea>
            </div>

            <div class="form-buttons">
                <button type="reset" class="btn-reset">Làm mới</button>
                <button type="submit" class="btn-submit">Đăng ký</button>
            </div>
        </form>
    </div>
</body>
</html>
